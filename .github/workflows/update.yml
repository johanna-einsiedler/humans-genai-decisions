# Rebuilds the numbers and publishes the page whenever the data changes.
# Ready for the day this folder is a GitHub repository with Pages enabled (Settings → Pages → GitHub Actions).
name: update dashboard
on:
  push:
    paths: ["data/**", "analysis/**"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with: { packages: "any::metafor, any::clubSandwich, any::jsonlite" }
      # fails with a readable message when the release no longer offers a column the page needs
      - run: Rscript analysis/build.R
      - name: commit the rebuilt numbers
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived.json && (git diff --cached --quiet || git commit -m "rebuild derived.json") && git push || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
